<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="kaszara — systems, graphics, desktop software">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#131a2a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0f6fc"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#a5b4fc" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="320" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle cx="930" cy="160" r="230" fill="url(#glow)"/>

    <!-- orbitals -->
    <g transform="translate(930 160)">
      <g>
        <ellipse rx="180" ry="62" fill="none" stroke="url(#orbit)" stroke-width="1.4"/>
        <circle r="5" fill="#7dd3fc">
          <animateMotion dur="8s" repeatCount="indefinite" path="M180,0 A180,62 0 1,1 -180,0 A180,62 0 1,1 180,0"/>
        </circle>
      </g>
      <g transform="rotate(60)">
        <ellipse rx="180" ry="62" fill="none" stroke="url(#orbit)" stroke-width="1.4"/>
        <circle r="4.5" fill="#a5b4fc">
          <animateMotion dur="11s" repeatCount="indefinite" path="M180,0 A180,62 0 1,1 -180,0 A180,62 0 1,1 180,0"/>
        </circle>
      </g>
      <g transform="rotate(120)">
        <ellipse rx="180" ry="62" fill="none" stroke="url(#orbit)" stroke-width="1.4"/>
        <circle r="4" fill="#f0f6fc">
          <animateMotion dur="14s" repeatCount="indefinite" path="M180,0 A180,62 0 1,1 -180,0 A180,62 0 1,1 180,0"/>
        </circle>
      </g>
      <circle r="16" fill="#7dd3fc" fill-opacity="0.12">
        <animate attributeName="r" values="14;20;14" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle r="6" fill="#f0f6fc"/>
    </g>

    <!-- text -->
    <text x="64" y="104" font-family="'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="17" fill="#7dd3fc">~/kaszara <tspan fill="#6b7280">$</tspan> <tspan fill="#9ca3af">whoami</tspan></text>
    <text x="62" y="190" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="84" font-weight="700" letter-spacing="-3" fill="url(#name)">kaszara</text>
    <text x="64" y="232" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="22" fill="#9ca3af">systems · graphics · desktop software</text>
    <text x="64" y="274" font-family="'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" fill="#6b7280">C/C++  ·  Rust  ·  TypeScript</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
